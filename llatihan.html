<!DOCTYPE html>
<html>
<head>
    <title>Halaman Mahasiswa</title>
</head>
<body>

    <h2>Table Mahasiswa</h2>
    <table border="1" cellpadding="10">
        <tr>
            <th>NO</th>
            <th>Nama</th>
            <th>Kelas</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Denta</td>
            <td>3D</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Hudza</td>
            <td>3D</td>
        </tr>
    </table>

    <h2>Form Pendaftaran</h2>
    <form>
        Nama: <input type="text" name="nama"><br><br>
        Email: <input type="email" name="email"><br><br>
        Password: <input type="password" name="password"><br><br>
        <input type="submit" value="Kirim">
    </form>

    <h2>List Siswa</h2>
    <ul>
        <li>Denta</li>
        <li>Hudza</li>
    </ul>

    <h2>Menampilkan Gambar</h2>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSr_GD6SU6S7_JW9ngCibr9Z6539U4vrHq4_g&s" alt="Contoh Gambar" width="300">

</html>
